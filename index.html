  /* ---------- English original toggle (中文版 only) ---------- */
  /* hidden by default, revealed on hovering its host — same idea as the diagram fullscreen button */
  .en-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    vertical-align: middle;
    width: 18px; height: 18px; margin-left: 5px; padding: 0; flex: none;
    border: 1px solid var(--border); border-radius: 5px;
    background: transparent; color: var(--muted);
    cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity .15s, color .12s, border-color .12s, background .12s;
  }
  :is(h1,h2,h3,h4,h5,h6,p,li):hover > .en-toggle,
  .en-table-wrap:hover > .en-toggle { opacity: 1; pointer-events: auto; }
  .en-toggle:hover { color: var(--fg); border-color: var(--muted); background: var(--hover); }
  .en-toggle.active { color: var(--accent); border-color: var(--accent); background: var(--hover); }
  .en-toggle svg { width: 12px; height: 12px; display: block; }
  .en-table-wrap { position: relative; }
  .en-orig {
    margin: 0.4em 0 1.1em;
    color: var(--muted); font-size: 0.95em; line-height: 1.8;

  }

  li > .en-orig { margin: 0.25em 0 0.35em; }

  h1 + .en-orig, h2 + .en-orig, h3 + .en-orig, h4 + .en-orig { font-size: 1rem; font-weight: 400; margin-top: 0.3em; }
  /* table original: a block (no text underline), marked with a dashed rail + caption */

    text-decoration: none; margin: 0.5em 0 1.4em;
    border-left: 2px dashed var(--muted); padding-left: 14px;
  }
  .en-orig-block > table { margin-top: 0.3em; }
  table + .en-toggle { margin: 0.4em 0 0; }

  .content h1, .content h2, .content h3, .content h4 { line-height: 1.3; font-weight: 600; margin: 1.8em 0 0.6em; }

  .content h4 { font-size: 1em; color: var(--muted); }
  .content p, .content ul, .content ol { margin: 0.9em 0; }
  .content a { color: var(--accent); text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 2.2em 0; }
  .content blockquote {
    border-left: 3px solid var(--border);

    margin: 1em 0;

  .content code {

  /* mermaid */
  .mermaid-wrap {

  }
  .mermaid-wrap > svg { max-width: 100%; height: auto; }

  .expand-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px; height: 26px;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.12s, border-color 0.12s;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;

  .mermaid-wrap:hover .expand-btn,

  .expand-btn:hover { color: var(--fg); border-color: var(--muted); }
  .expand-btn svg { width: 12px; height: 12px; }

  .diagram-en-toggle {
    position: absolute;
    top: 8px; right: 40px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px; height: 26px;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.12s, border-color 0.12s, background 0.12s;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .mermaid-wrap:hover .diagram-en-toggle,

  .diagram-en-toggle:hover { color: var(--fg); border-color: var(--muted); background: var(--hover); }
  .diagram-en-toggle.active { color: var(--accent); border-color: var(--accent); }

  /* fullscreen modal */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;

  .modal.open { display: flex; }

    border-radius: 5px;
    cursor: pointer;

  }
  .modal-toolbar button:hover { background: var(--hover); color: var(--fg); }
  .modal-toolbar button:disabled { opacity: 0.35; cursor: not-allowed; }
  .modal-toolbar button:disabled:hover { background: transparent; color: var(--muted); }
  .modal-toolbar svg { width: 14px; height: 14px; }
  .modal-zoom-pct {
    font-size: 12px;
    color: var(--muted);

    text-align: center;

  .modal-toolbar .divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

  .modal-translate {
    position: fixed;
    top: 16px; right: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;

  }
  .modal-translate:hover { background: var(--hover); color: var(--fg); }
  .modal-translate.active { color: var(--accent); border-color: var(--accent); }
  .modal-translate svg { width: 16px; height: 16px; }
  .modal-translate[hidden] { display: none; }

  /* pager */
  .pager {

  @media (max-width: 860px) {

    .pager { flex-direction: column; }

  }

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';

  const CHAPTERS = [
    '00-how-to-use-this-course',
    '01-function-calling',
    '02-the-agent-loop',
    '03-tools-validation',
    '04-prompts-context-cache',
    '05-short-term-memory',
    '06-long-term-recall',
    '07-memory-writing',
    '08-state-and-persistence',
    '09-planning-patterns',
    '10-multi-agent-delegation',
    '11-agent-harness',
    '12-human-in-the-loop',
    '13-connectors-mcp-ipc',
    '14-skills-mcp-subagents',
    '15-backend-infrastructure',
    '16-observability',
    '17-cost-latency-model-strategy',
    '18-safety-adversarial-inputs',
    '19-ops-and-forward-deployed',
    '20-proactive-agents',
    '21-self-evolving-agents',
    '22-designing-your-own-agent',
  ];

  const GROUPS = [
    { en: 'Meta',              zh: '导论',       items: [0] },
    { en: 'Foundations',       zh: '基础',       items: [1, 2, 3, 4] },
    { en: 'Memory & State',    zh: '记忆与状态',  items: [5, 6, 7, 8] },
    { en: 'Coordination',      zh: '协同',       items: [9, 10, 11] },
    { en: 'External Surface',  zh: '外部接口',    items: [12, 13, 14] },
    { en: 'Production Scale',  zh: '生产规模',    items: [15, 16, 17] },
    { en: 'Quality & Ops',     zh: '质量与运维',  items: [18, 19] },
    { en: 'Agency',            zh: '能动性',      items: [20, 21] },
    { en: 'Design Canvas',     zh: '设计画布',    items: [22] },
  ];

  const titleCache = { course: {}, 'course-zh': {} };
  const mdCache = {};
  const lowerCache = {};

  const STORAGE_THEME = 'course-theme';
  const STORAGE_COLLAPSED = 'course-collapsed-groups';

  const state = {
    lang: 'course',
    idx: 0,
    view: 'home', // 'home' (cover) | 'chapter'
    theme: localStorage.getItem(STORAGE_THEME) || null, // null = follow system
    collapsed: new Set(JSON.parse(localStorage.getItem(STORAGE_COLLAPSED) || '[]')),
    query: '',
  };

  const COVERS = { course: 'cover-en.png', 'course-zh': 'cover-zh.png' };
  // keep the social-share image consistent with the language being viewed
  function updateOgImage(lang) {
    const file = COVERS[lang] || COVERS.course;
    const abs = new URL(file, location.href).href;
    const og = document.getElementById('ogImage');
    const tw = document.getElementById('twImage');
    if (og) og.setAttribute('content', abs);
    if (tw) tw.setAttribute('content', abs);
  }

  // ---------- theme ----------
  function effectiveTheme() {
    if (state.theme) return state.theme;
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);
    else document.documentElement.removeAttribute('data-theme');
    updateThemeIcon();
  }
  // sun / moon / auto icons
  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
    auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
  };
  function updateThemeIcon() {
    const icon = document.getElementById('themeIcon');
    const mode = state.theme || 'auto';
    icon.innerHTML = ICONS[mode === 'auto' ? 'auto' : (mode === 'dark' ? 'moon' : 'sun')];
    document.getElementById('themeBtn').title = `theme: ${mode}`;
  }
  function cycleTheme() {
    // light → dark → auto → light …
    const order = ['light', 'dark', null];
    const cur = state.theme === null ? null : state.theme;
    const i = order.indexOf(cur);
    const next = order[(i + 1) % order.length];
    state.theme = next;
    if (next === null) localStorage.removeItem(STORAGE_THEME);
    else localStorage.setItem(STORAGE_THEME, next);
    applyTheme();
    initMermaid();
    // re-render the current chapter's diagrams with new theme
    rerenderMermaid();
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!state.theme) { initMermaid(); rerenderMermaid(); }
  });

  // ---------- mermaid setup (minimal theme aligned with page) ----------
  function mermaidThemeVars() {
    const dark = effectiveTheme() === 'dark';
    if (dark) {
      return {
        background: '#111213',
        primaryColor: '#1a1b1d',
        primaryTextColor: '#e6e6e6',
        primaryBorderColor: '#3a3b3d',
        secondaryColor: '#1f2022',
        tertiaryColor: '#16171a',
        lineColor: '#9a9a9a',
        textColor: '#e6e6e6',
        mainBkg: '#1a1b1d',
        secondBkg: '#1f2022',
        nodeBorder: '#3a3b3d',
        clusterBkg: '#16171a',
        clusterBorder: '#2a2b2d',
        edgeLabelBackground: '#111213',
        actorBkg: '#1a1b1d',
        actorBorder: '#3a3b3d',
        actorTextColor: '#e6e6e6',
        actorLineColor: '#9a9a9a',
        signalColor: '#e6e6e6',
        signalTextColor: '#e6e6e6',
        labelBoxBkgColor: '#1f2022',
        labelBoxBorderColor: '#3a3b3d',
        labelTextColor: '#e6e6e6',
        loopTextColor: '#e6e6e6',
        noteBkgColor: '#232527',
        noteTextColor: '#e6e6e6',
        noteBorderColor: '#3a3b3d',
      };
    }
    return {
      background: '#ffffff',
      primaryColor: '#fafafa',
      primaryTextColor: '#1a1a1a',
      primaryBorderColor: '#d0d7de',
      secondaryColor: '#f6f8fa',
      tertiaryColor: '#fafafa',
      lineColor: '#6b6b6b',
      textColor: '#1a1a1a',
      mainBkg: '#fafafa',
      secondBkg: '#f6f8fa',
      nodeBorder: '#d0d7de',
      clusterBkg: '#fafafa',
      clusterBorder: '#e5e5e5',
      edgeLabelBackground: '#ffffff',
      actorBkg: '#fafafa',
      actorBorder: '#d0d7de',
      actorTextColor: '#1a1a1a',
      actorLineColor: '#6b6b6b',
      signalColor: '#1a1a1a',
      signalTextColor: '#1a1a1a',
      labelBoxBkgColor: '#f6f8fa',
      labelBoxBorderColor: '#d0d7de',
      labelTextColor: '#1a1a1a',
      loopTextColor: '#1a1a1a',
      noteBkgColor: '#fff8d6',
      noteTextColor: '#1a1a1a',
      noteBorderColor: '#e5e5e5',
    };
  }
  function initMermaid() {
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        fontFamily: 'var(--font-sans), system-ui, sans-serif',
        fontSize: '13px',
        ...mermaidThemeVars(),
      },
      flowchart: { curve: 'basis', padding: 12 },
      sequence: { actorMargin: 50, boxMargin: 8, messageMargin: 30 },
      securityLevel: 'loose',
    });
  }
  initMermaid();
  applyTheme();

  // ---------- marked ----------
  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => {
    if (lang === 'mermaid') {
      const encoded = code.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      return `<div class="mermaid-wrap"><div class="mermaid" data-src="${encodeURIComponent(code)}">${encoded}</div><button class="expand-btn" aria-label="fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg></button></div>`;
    }
    return origCode(code, lang);
  };
  marked.setOptions({ renderer, breaks: false, gfm: true });

  // ---------- chapter / title helpers ----------
  function deriveTitle(slug) {
    const num = slug.slice(0, 2);
    const rest = slug.slice(3).replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return { num, rest };
  }
  function extractH1(md, fallback) {
    const m = md.match(/^#\s+(.+?)\s*$/m);
    return m ? m[1].trim() : fallback;
  }
  async function fetchChapter(lang, idx) {
    const key = `${lang}/${idx}`;
    if (mdCache[key]) return mdCache[key];
    const slug = CHAPTERS[idx];
    const res = await fetch(`${lang}/${slug}.md`);
    if (!res.ok) throw new Error(`Failed to load ${lang}/${slug}.md`);
    const text = await res.text();
    mdCache[key] = text;
    lowerCache[key] = text.toLowerCase();
    titleCache[lang][idx] = extractH1(text, deriveTitle(slug).rest);
    return text;
  }
  function tocLabel(lang, idx) {
    return titleCache[lang][idx] || deriveTitle(CHAPTERS[idx]).rest;
  }

  // ---------- TOC rendering ----------
  function highlightMatch(text, query) {
    if (!query) return escapeHTML(text);
    const lower = text.toLowerCase();
    const q = query.toLowerCase();
    const i = lower.indexOf(q);
    if (i === -1) return escapeHTML(text);
    return escapeHTML(text.slice(0, i)) + '<mark>' + escapeHTML(text.slice(i, i + q.length)) + '</mark>' + escapeHTML(text.slice(i + q.length));
  }
  function escapeHTML(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function matchesQuery(lang, idx, q) {
    if (!q) return true;
    const label = tocLabel(lang, idx).toLowerCase();
    if (label.includes(q)) return true;
    const body = lowerCache[`${lang}/${idx}`];
    return body ? body.includes(q) : false;
  }

  function renderTOC() {
    const root = document.getElementById('toc');
    const q = state.query.trim().toLowerCase();
    const groupTitle = g => state.lang === 'course-zh' ? g.zh : g.en;
    const html = GROUPS.map((g, gi) => {
      const visibleItems = g.items.filter(i => matchesQuery(state.lang, i, q));
      if (q && visibleItems.length === 0) return '';
      const isCollapsed = !q && state.collapsed.has(gi);
      const items = g.items.map(i => {
        const { num } = deriveTitle(CHAPTERS[i]);
        const label = tocLabel(state.lang, i);
        const matched = matchesQuery(state.lang, i, q);
        const hidden = q && !matched ? ' hidden' : '';
        const active = (state.view === 'chapter' && i === state.idx) ? ' active' : '';
        const display = q ? highlightMatch(label, q) : escapeHTML(label);
        return `<a class="toc-link${active}${hidden}" href="#${state.lang}/${num}" data-idx="${i}"><span class="num">${num}</span>${display}</a>`;
      }).join('');
      return `<div class="group${isCollapsed ? ' collapsed' : ''}" data-group="${gi}">
        <button class="group-head" data-group-toggle="${gi}">
          <span>${escapeHTML(groupTitle(g))}</span><span class="chev">▾</span>
        </button>
        <div class="group-items">${items}</div>
      </div>`;
    }).join('');
    const empty = q && !GROUPS.some(g => g.items.some(i => matchesQuery(state.lang, i, q)));
    root.innerHTML = html + (empty ? `<div class="empty-hint">${state.lang === 'course-zh' ? '没有匹配的章节' : 'No matches'}</div>` : '');
  }

  // ---------- chapter rendering ----------
  async function renderChapter() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading">Loading…</div>';
    let md;
    try {
      md = await fetchChapter(state.lang, state.idx);
    } catch (e) {
      content.innerHTML = `<div class="loading">Failed to load chapter. Make sure you are serving this directory over HTTP (e.g. <code>python -m http.server</code>).<br><br><small>${e.message}</small></div>`;
      return;
    }
    content.innerHTML = marked.parse(md) + pagerHTML();
    window.scrollTo({ top: 0, behavior: 'instant' });
    let enMd = null;
    if (state.lang === 'course-zh') {
      // attach per-unit English-original toggles (read the source when the translation is unclear)
      try {
        enMd = await fetchChapter('course', state.idx);
        if (state.lang === 'course-zh') attachEnglishOriginals(content, md, enMd);
      } catch (e) { enMd = null; /* English source unavailable — skip silently */ }
    }
    await renderMermaidBlocks();
    // diagrams whose labels were translated get an in-place EN/中文 toggle next to fullscreen
    if (state.lang === 'course-zh' && enMd) attachDiagramToggles(md, enMd);
    renderTOC();
    // expand the group containing the active chapter
    const gi = GROUPS.findIndex(g => g.items.includes(state.idx));
    if (gi >= 0 && state.collapsed.has(gi)) {
      state.collapsed.delete(gi);
      persistCollapsed();
      renderTOC();
    }
  }
  // ---------- per-unit English original (中文版) ----------
  // The zh translation mirrors the en source block-for-block, so rendering both to HTML
  // yields structurally identical trees: the k-th heading / paragraph / list-item in the
  // zh DOM matches the k-th one in the en DOM. We zip them by index and attach a toggle to
  // each translated unit that reveals the English original (dashed-underlined) below it.
  const EN_TARGET_SEL = 'h1,h2,h3,h4,h5,h6,p,li,table';
  function ownInlineHTML(el) {
    const clone = el.cloneNode(true);
    clone.querySelectorAll('ul, ol, p').forEach(n => n.remove());
    return clone.innerHTML.trim();
  }
  function attachEnglishOriginals(container, zhMd, enMd) {
    let enRoot;
    try {
      enRoot = document.createElement('div');
      enRoot.innerHTML = marked.parse(enMd);
    } catch (e) { return; }
    const zhEls = [...container.querySelectorAll(EN_TARGET_SEL)].filter(el => !el.closest('.pager'));
    const enEls = [...enRoot.querySelectorAll(EN_TARGET_SEL)];
    // only proceed when the two trees line up 1:1, else we'd pair the wrong original
    if (zhEls.length !== enEls.length) return;
    zhEls.forEach((z, k) => {
      const e = enEls[k];
      if (!e || z.tagName !== e.tagName) return;
      const isLi = z.tagName === 'LI';
      const isTable = z.tagName === 'TABLE';
      // loose list item (<li><p>..</p></li>): let the inner <p> carry the toggle, skip the <li>
      if (isLi && z.querySelector(':scope > p')) return;
      // a table is toggled as a whole block (full English table), everything else by its inline text
      const enHTML = isTable ? e.outerHTML : ownInlineHTML(e);
      if (!enHTML) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'en-toggle';
      btn.title = '显示英文原文';
      btn.setAttribute('aria-label', '显示英文原文');
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7M9 3v2c0 4-2 7-5 9M5 9c0 2.5 2 4.5 5 5.5"/><path d="M13.5 21l3.5-8 3.5 8M14.7 18h4.6"/></svg>';
      const orig = document.createElement('div');
      orig.className = isTable ? 'en-orig en-orig-block' : 'en-orig';
      orig.hidden = true;
      orig.setAttribute('lang', 'en');
      orig.innerHTML = enHTML;
      if (isTable) {
        // wrap table + toggle + original so the toggle reveals on hovering the table region
        const tw = document.createElement('div');
        tw.className = 'en-table-wrap';
        z.parentNode.insertBefore(tw, z);
        tw.appendChild(z);
        tw.appendChild(btn);
        tw.appendChild(orig);
      } else {
        z.appendChild(document.createTextNode(' '));
        z.appendChild(btn);
        if (isLi) {
          // place the original inside the item, before any nested sub-list
          const sub = z.querySelector(':scope > ul, :scope > ol');
          if (sub) z.insertBefore(orig, sub); else z.appendChild(orig);
        } else {
          z.after(orig);
        }
      }
      btn.addEventListener('click', () => {
        const show = orig.hidden;
        orig.hidden = !show;
        btn.classList.toggle('active', show);
        btn.setAttribute('aria-expanded', String(show));
        btn.title = show ? '收起英文原文' : '显示英文原文';
      });
    });
  }

  // pull the raw source of each ```mermaid block, in document order
  function extractMermaidSources(md) {
    const out = [];
    const re = /```mermaid\r?\n([\s\S]*?)```/g;
    let m;
    while ((m = re.exec(md)) !== null) out.push(m[1].replace(/\s+$/, ''));
    return out;
  }

  // render (and cache on the wrap) the English version of a translatable diagram
  async function diagramEnSvg(wrap) {
    if (wrap._enSvg) return wrap._enSvg;
    if (!wrap._enSrc) return null;
    try {
      const { svg } = await mermaid.render('mm-en-' + Date.now() + '-' + (wrap._enKey || 0), sanitizeMermaid(wrap._enSrc));
      const tmp = document.createElement('div'); tmp.innerHTML = svg;
      wrap._enSvg = tmp.querySelector('svg');
    } catch (e) { return null; }
    return wrap._enSvg;
  }

  // for diagrams whose labels were translated, add a toggle (left of fullscreen) that
  // swaps the rendered diagram between 中文 and the English original in place
  function attachDiagramToggles(zhMd, enMd) {
    const zhSrc = extractMermaidSources(zhMd);
    const enSrc = extractMermaidSources(enMd);
    const wraps = [...document.querySelectorAll('#content .mermaid-wrap')];
    if (wraps.length !== zhSrc.length) return; // alignment uncertain — bail
    wraps.forEach((wrap, k) => {
      const en = enSrc[k];
      if (en == null || en === zhSrc[k]) return; // identical in both languages — nothing to translate
      const zhSvg = wrap.querySelector(':scope > svg');
      if (!zhSvg) return; // render failed / fell back to <pre>
      const expandBtn = wrap.querySelector(':scope > .expand-btn');
      // expose to the fullscreen modal so its translate button can reuse these
      wrap._zhSvg = zhSvg;
      wrap._enSrc = en;
      wrap._enKey = k;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'diagram-en-toggle';
      btn.title = '显示英文原图';
      btn.setAttribute('aria-label', '显示英文原图');
      btn.setAttribute('aria-pressed', 'false');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7M9 3v2c0 4-2 7-5 9M5 9c0 2.5 2 4.5 5 5.5"/><path d="M13.5 21l3.5-8 3.5 8M14.7 18h4.6"/></svg>';

      let showingEn = false, busy = false;
      btn.addEventListener('click', async () => {
        if (busy) return;
        const cur = wrap.querySelector(':scope > svg');
        if (!showingEn) {
          busy = true;
          const enSvg = await diagramEnSvg(wrap);
          busy = false;
          if (!enSvg || !cur) return;
          cur.replaceWith(enSvg);
          showingEn = true;
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
          btn.title = '显示中文图';
        } else {
          if (cur) cur.replaceWith(zhSvg);
          showingEn = false;
          btn.classList.remove('active');
          btn.setAttribute('aria-pressed', 'false');
          btn.title = '显示英文原图';
        }
      });

      if (expandBtn) wrap.insertBefore(btn, expandBtn); else wrap.appendChild(btn);
    });
  }

  // In stateDiagrams, ':' is the label delimiter, so a colon inside a transition label
  // (e.g. "A --> B : note (stop_reason: end_turn)") is a parse error. The course source has
  // one such diagram; escape any colon after the label delimiter using mermaid's '#58;' code.
  function sanitizeMermaid(src) {
    const head = src.trimStart().split('\n')[0].trim();
    if (!/^stateDiagram(-v2)?\b/.test(head)) return src;
    return src.split('\n').map(line => {
      const arrow = line.indexOf('-->');
      if (arrow === -1) return line;
      const delim = line.indexOf(':', arrow);
      if (delim === -1) return line;
      return line.slice(0, delim + 1) + line.slice(delim + 1).replace(/:/g, '#58;');
    }).join('\n');
  }

  async function renderMermaidBlocks() {
    const blocks = document.querySelectorAll('#content .mermaid');
    for (let i = 0; i < blocks.length; i++) {
      const el = blocks[i];
      const src = el.dataset.src ? decodeURIComponent(el.dataset.src) : el.textContent;
      el.dataset.src = encodeURIComponent(src);
      const id = `mm-${Date.now()}-${i}`;
      try {
        const { svg } = await mermaid.render(id, sanitizeMermaid(src));
        el.outerHTML = svg;
      } catch (err) {
        el.outerHTML = `<pre><code>${escapeHTML(src)}</code></pre>`;
      }
    }
    // re-bind expand buttons (the mermaid div was replaced by SVG, button still sits in wrapper)
    document.querySelectorAll('.mermaid-wrap').forEach(wrap => {
      const btn = wrap.querySelector('.expand-btn');
      if (!btn || btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', () => openModal(wrap));
    });
  }
  async function rerenderMermaid() {
    // walk all wraps, find their SVG or pre, regenerate from data-src on a sibling cache
    // simpler: just re-render the chapter
    if (document.querySelector('.mermaid-wrap')) {
      // we need the source — store on wrap when first rendering
      await renderChapter();
    }
  }

  function pagerHTML() {
    const prev = state.idx > 0 ? state.idx - 1 : null;
    const next = state.idx < CHAPTERS.length - 1 ? state.idx + 1 : null;
    const prevLabel = state.lang === 'course-zh' ? '上一章' : 'Previous';
    const nextLabel = state.lang === 'course-zh' ? '下一章' : 'Next';
    const homeLabel = state.lang === 'course-zh' ? '封面' : 'Cover';
    const prevBlock = prev !== null
      ? `<a href="#${state.lang}/${deriveTitle(CHAPTERS[prev]).num}" class="prev">
           <span class="label">← ${prevLabel}</span>
           <span class="title">${escapeHTML(tocLabel(state.lang, prev))}</span>
         </a>`
      : `<a href="#${state.lang}" class="prev">
           <span class="label">← ${prevLabel}</span>
           <span class="title">${homeLabel}</span>
         </a>`;
    const nextBlock = next !== null
      ? `<a href="#${state.lang}/${deriveTitle(CHAPTERS[next]).num}" class="next">
           <span class="label">${nextLabel} →</span>
           <span class="title">${escapeHTML(tocLabel(state.lang, next))}</span>
         </a>`
      : `<a class="next placeholder"><span class="label">—</span><span class="title">—</span></a>`;
    return `<div class="pager">${prevBlock}${nextBlock}</div>`;
  }

  async function preloadAll(lang) {
    await Promise.all(CHAPTERS.map((_, i) => fetchChapter(lang, i).catch(() => null)));
    renderTOC();
  }

  // ---------- fullscreen modal with zoom ----------
  const modal = document.getElementById('modal');
  const modalInner = document.getElementById('modalInner');
  const modalToolbar = document.getElementById('modalToolbar');
  const zoomPctEl = document.getElementById('zoomPct');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const modalTranslate = document.getElementById('modalTranslate');
  const ZOOM_MIN = 0.25, ZOOM_MAX = 8, ZOOM_STEP = 1.25;
  let modalZoom = 1;
  let modalKind = null; // 'svg' | 'pre'
  let modalWrap = null;        // the diagram wrapper currently shown (for the translate toggle)
  let modalShowingEn = false;  // whether the modal is currently showing the English diagram

  function setZoom(z) {
    modalZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
    const target = modalInner.firstElementChild;
    if (target) {
      if (modalKind === 'svg') {
        target.style.width = `${100 * modalZoom}%`;
        target.style.height = 'auto';
      } else if (modalKind === 'pre') {
        target.style.fontSize = `${13 * modalZoom}px`;
      }
    }
    zoomPctEl.textContent = `${Math.round(modalZoom * 100)}%`;
    zoomInBtn.disabled = modalZoom >= ZOOM_MAX - 1e-6;
    zoomOutBtn.disabled = modalZoom <= ZOOM_MIN + 1e-6;
  }
  function zoomIn() { setZoom(modalZoom * ZOOM_STEP); }
  function zoomOut() { setZoom(modalZoom / ZOOM_STEP); }
  function zoomReset() { setZoom(1); modalInner.scrollTo({ top: 0, left: 0 }); }

  function mountSvgInModal(svgEl) {
    modalInner.innerHTML = '';
    const clone = svgEl.cloneNode(true);
    clone.removeAttribute('width');
    clone.removeAttribute('height');
    clone.style.maxWidth = '';
    clone.style.maxHeight = '';
    if (!clone.getAttribute('viewBox') && svgEl.getBBox) {
      try { const bb = svgEl.getBBox(); clone.setAttribute('viewBox', `${bb.x} ${bb.y} ${bb.width} ${bb.height}`); } catch (e) {}
    }
    modalInner.appendChild(clone);
    modalKind = 'svg';
  }
  function openModal(wrap) {
    const svg = wrap.querySelector(':scope > svg');
    const pre = wrap.querySelector(':scope > pre');
    modalWrap = wrap;
    if (svg) {
      mountSvgInModal(svg);
      if (wrap._zhSvg) {
        // translatable diagram → offer the 中/英 toggle, matching whatever is currently shown
        modalShowingEn = (svg === wrap._enSvg);
        modalTranslate.hidden = false;
        modalTranslate.classList.toggle('active', modalShowingEn);
        modalTranslate.title = modalShowingEn ? '显示中文图' : '显示英文原图';
      } else {
        modalTranslate.hidden = true;
      }
    } else if (pre) {
      modalInner.innerHTML = '';
      modalInner.appendChild(pre.cloneNode(true));
      modalKind = 'pre';
      modalTranslate.hidden = true;
    } else return;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    setZoom(1);
    modalInner.scrollTo({ top: 0, left: 0 });
  }
  async function modalShowLang(en) {
    if (!modalWrap || !modalWrap._zhSvg) return;
    if (en) {
      const enSvg = await diagramEnSvg(modalWrap);
      if (!enSvg) return;
      mountSvgInModal(enSvg);
    } else {
      mountSvgInModal(modalWrap._zhSvg);
    }
    modalShowingEn = en;
    modalTranslate.classList.toggle('active', en);
    modalTranslate.title = en ? '显示中文图' : '显示英文原图';
    setZoom(1);
    modalInner.scrollTo({ top: 0, left: 0 });
  }
  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    modalInner.innerHTML = '';
    modalKind = null;
    modalWrap = null;
    modalTranslate.hidden = true;
  }
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalTranslate.addEventListener('click', () => modalShowLang(!modalShowingEn));
  zoomInBtn.addEventListener('click', zoomIn);
  zoomOutBtn.addEventListener('click', zoomOut);
  zoomResetBtn.addEventListener('click', zoomReset);
  // ctrl/cmd + wheel to zoom
  modalInner.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    if (e.deltaY < 0) zoomIn(); else zoomOut();
  }, { passive: false });

  // click-and-drag to pan
  let dragging = false, dragStartX = 0, dragStartY = 0, dragScrollX = 0, dragScrollY = 0;
  modalInner.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragScrollX = modalInner.scrollLeft;
    dragScrollY = modalInner.scrollTop;
    modalInner.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    modalInner.scrollLeft = dragScrollX - (e.clientX - dragStartX);
    modalInner.scrollTop = dragScrollY - (e.clientY - dragStartY);
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    modalInner.classList.remove('dragging');
  });

  // ---------- routing ----------
  function parseHash() {
    const h = location.hash.replace(/^#/, '');
    const m = h.match(/^(course|course-zh)\/(\d{1,2})$/);
    if (m) {
      const idx = Math.max(0, Math.min(CHAPTERS.length - 1, parseInt(m[2], 10)));
      return { lang: m[1], idx, view: 'chapter' };
    }
    const mh = h.match(/^(course|course-zh)$/);
    if (mh) return { lang: mh[1], idx: 0, view: 'home' };
    return null;
  }
  function pushHash(lang, idx) {
    const num = deriveTitle(CHAPTERS[idx]).num;
    const target = `#${lang}/${num}`;
    if (location.hash !== target) location.hash = target;
  }
  function pushHome(lang) {
    const target = `#${lang}`;
    if (location.hash !== target) location.hash = target;
  }
  function goHome() {
    state.view = 'home';
    pushHome(state.lang);
    applyState();
    closeSidebar();
  }

  async function applyState() {
    document.documentElement.lang = state.lang === 'course-zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('.lang-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === state.lang);
    });
    document.getElementById('search').placeholder = state.lang === 'course-zh' ? '搜索章节…' : 'Search chapters…';
    updateOgImage(state.lang);
    renderTOC();
    if (state.view === 'home') renderHome();
    else await renderChapter();
  }

  function renderHome() {
    const content = document.getElementById('content');
    const zh = state.lang === 'course-zh';
    const cover = COVERS[state.lang] || COVERS.course;
    const alt = zh ? '课程封面（中文版）' : 'Course cover (English)';
    const cta = zh ? '开始阅读' : 'Start reading';
    const hint = zh ? '或从左侧目录任选一章' : 'or pick any chapter from the sidebar';
    content.innerHTML = `
      <div class="home">
        <div class="cover-frame" id="coverFrame" role="link" tabindex="0" aria-label="${cta}">
          <img src="${cover}" alt="${alt}" />
        </div>
        <div>
          <button class="home-cta" id="homeCta">
            ${cta}
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <div class="home-hint">${hint}</div>
        </div>
      </div>`;
    window.scrollTo({ top: 0, behavior: 'instant' });
    const start = () => { state.view = 'chapter'; state.idx = 0; pushHash(state.lang, 0); applyState(); };
    document.getElementById('coverFrame').addEventListener('click', start);
    document.getElementById('homeCta').addEventListener('click', start);
  }

  function persistCollapsed() {
    localStorage.setItem(STORAGE_COLLAPSED, JSON.stringify([...state.collapsed]));
  }

  // ---------- events ----------
  document.querySelectorAll('.lang-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.lang === state.lang) return;
      state.lang = btn.dataset.lang;
      if (state.view === 'home') pushHome(state.lang);
      else pushHash(state.lang, state.idx);
      applyState();
      preloadAll(state.lang);
    });
  });

  // sidebar title → back to cover/home
  const homeLink = document.getElementById('homeLink');
  homeLink.addEventListener('click', goHome);
  homeLink.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); } });

  window.addEventListener('hashchange', () => {
    const parsed = parseHash();
    if (!parsed) return;
    const changed = parsed.lang !== state.lang || parsed.idx !== state.idx || parsed.view !== state.view;
    state.lang = parsed.lang;
    state.idx = parsed.idx;
    state.view = parsed.view;
    if (changed) applyState();
  });

  document.addEventListener('click', e => {
    const link = e.target.closest('.toc-link');
    if (link) {
      e.preventDefault();
      const idx = parseInt(link.dataset.idx, 10);
      state.idx = idx;
      pushHash(state.lang, idx);
      applyState();
      closeSidebar();
      return;
    }
    const groupToggle = e.target.closest('[data-group-toggle]');
    if (groupToggle) {
      if (state.query.trim()) return; // collapse disabled while searching
      const gi = parseInt(groupToggle.dataset.groupToggle, 10);
      if (state.collapsed.has(gi)) state.collapsed.delete(gi);
      else state.collapsed.add(gi);
      persistCollapsed();
      renderTOC();
    }
  });

  document.getElementById('themeBtn').addEventListener('click', cycleTheme);

  const searchEl = document.getElementById('search');
  let searchTimer;
  searchEl.addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = e.target.value;
      renderTOC();
    }, 80);
  });
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchEl.value = ''; state.query = ''; renderTOC(); }
  });

  // mobile menu
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  const menuBtn = document.getElementById('menuBtn');
  function openSidebar() { sidebar.classList.add('open'); backdrop.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
  menuBtn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  backdrop.addEventListener('click', closeSidebar);

  // keyboard nav
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (modal.classList.contains('open')) {
      if (e.key === 'Escape') closeModal();
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
      else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomOut(); }
      else if (e.key === '0') { e.preventDefault(); zoomReset(); }
      return;
    }
    if (e.key === 'ArrowRight' && state.view === 'home') {
      state.view = 'chapter'; state.idx = 0; pushHash(state.lang, 0); applyState();
    } else if (e.key === 'ArrowLeft' && state.view === 'chapter' && state.idx === 0) {
      goHome();
    } else if (e.key === 'ArrowLeft' && state.idx > 0) {
      state.idx -= 1; pushHash(state.lang, state.idx); applyState();
    } else if (e.key === 'ArrowRight' && state.idx < CHAPTERS.length - 1) {
      state.idx += 1; pushHash(state.lang, state.idx); applyState();
    } else if (e.key === '/') {
      e.preventDefault(); searchEl.focus();
    }
  });

  // init
  const initial = parseHash();
  if (initial) {
    state.lang = initial.lang;
    state.idx = initial.idx;
    state.view = initial.view;
  } else {
    state.view = 'home';
    pushHome(state.lang);
  }
  applyState();
  preloadAll(state.lang);
</script>
</body>
</html>
